    <script>
      (function() {
        // 1. Global & Process Polyfill
        window.global = window;
        window.process = window.process || { env: {} };
        window.process.env = window.process.env || {};
        window.process.env.NODE_ENV = window.process.env.NODE_ENV || 'production';
        if (!window.process.env.GEMINI_API_KEY) window.process.env.GEMINI_API_KEY = ''; 

        // 2. Crypto Polyfill
        if (!window.crypto) {
          window.crypto = {};
        }

        // 3. getRandomValues Polyfill (Critical for UUIDs)
        if (!window.crypto.getRandomValues) {
          window.crypto.getRandomValues = function(array) {
            for (var i = 0; i < array.length; i++) {
              array[i] = Math.floor(Math.random() * 256);
            }
            return array;
          };
        }

        // 4. randomUUID Polyfill (RFC4122 Compliant)
        if (!window.crypto.randomUUID) {
          window.crypto.randomUUID = function() {
            return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function(c) {
              var r = window.crypto.getRandomValues(new Uint8Array(1))[0];
              return (c ^ r & 15 >> c / 4).toString(16);
            });
          };
        }
      })();
    </script>
